services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-javamifi_erp}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-javamifi_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-replace_me}@postgres:5432/${POSTGRES_DB:-javamifi_erp}
      JWT_SECRET: ${JWT_SECRET}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      RENTAL_PRICE_IDR: ${RENTAL_PRICE_IDR:-150000}
      RENTAL_DURATION_DAYS: ${RENTAL_DURATION_DAYS:-7}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/payment-success}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      ENABLE_DEV_TUNNEL: ${ENABLE_DEV_TUNNEL:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_MIDTRANS_CLIENT_KEY: ${VITE_MIDTRANS_CLIENT_KEY}
    ports:
      - "5173:5173"

  n8n:
    image: n8nio/n8n:latest
    # ponytail: first-boot-only seed (guard = sqlite exists); later JSON edits need a manual re-import/publish.
    entrypoint: ["/bin/sh", "-c", "[ -f /home/node/.n8n/database.sqlite ] || node /workflows/seed.mjs; exec n8n start"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace_me}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    ports:
      - "5678:5678"

volumes:
  pgdata:
  n8n-data:
